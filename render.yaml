services:
  - type: web
    name: MAET
    runtime: node
    plan: free
    rootDir: server
    # Install from the workspace root so the shared package and lockfile are used.
    buildCommand: cd .. && bun install && cd server && bun run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/health
    # rootDir alone only autodeploys on changes under server/, so shared/ and
    # lockfile changes never redeployed the backend. buildFilter paths are
    # relative to the repository root even with rootDir set:
    # https://render.com/docs/monorepo-support#setting-build-filters
    # https://render.com/docs/blueprint-spec#buildfilter
    buildFilter:
      paths:
        - server/**
        - shared/**
        - package.json
        - bun.lock
        - render.yaml
        - tsconfig.json
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Supabase (auth + DB)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      # Redis (caches, locks, rate limiting, paper pub/sub). Optional: the app degrades without it.
      - key: UPSTASH_REDIS_URL
        sync: false
      # Encryption key for stored broker secrets (32-byte base64)
      - key: ANGELONE_MASTER_KEY
        sync: false
      # SmartAPI credentials (TanmayQuant app). Set values in Render dashboard.
      - key: ANGELONE_API_KEY
        sync: false
      - key: ANGELONE_CLIENT_ID
        sync: false
      - key: ANGELONE_PIN
        sync: false
      - key: ANGELONE_TOTP_SECRET
        sync: false
      # Optional webhook for alert routing
      - key: ALERT_WEBHOOK_URL
        sync: false
      # NSE holiday calendar as JSON array of ISO date strings
      - key: NSE_HOLIDAYS_JSON
        sync: false
      # Optional BigQuery analytics sink (server/data/bigquery/client.ts).
      # When unset, warehouse writes fail and are logged; Postgres persistence
      # is unaffected. GOOGLE_APPLICATION_CREDENTIALS should point at a Render
      # secret file, e.g. /etc/secrets/gcp-service-account.json.
      - key: BIGQUERY_PROJECT
        sync: false
      - key: BIGQUERY_DATASET
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      # Comma-separated list of exact frontend origins allowed by CORS.
      # server/middleware/cors.ts (Nitro global middleware) reads this at
      # startup and falls back to the local dev hosts plus these Vercel hosts
      # when it is unset.
      - key: FRONTEND_ORIGIN
        value: "https://maet-pi.vercel.app,https://maet-tanmay-alphas-projects.vercel.app,https://maet-tanmay-alpha-tanmay-alphas-projects.vercel.app"
