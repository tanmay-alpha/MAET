name: CI Validation Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      BUN_TEST: "1"
      ENABLE_MARKET_SIMULATOR: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Type Check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check Every Test File Is Wired Into test:all
        run: bun run check:test-wiring

      - name: Run Unit Test Suite
        run: bun run test:unit

  paper-trading-integration:
    name: Paper Trading Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maet_test
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U postgres -d maet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      BUN_TEST: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maet_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Integration Test Suite
        run: bun run test:integration

  paper-trading-concurrency:
    name: Paper Trading Concurrency Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maet_test
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U postgres -d maet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      BUN_TEST: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maet_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Concurrency Test Suite
        run: bun run test:concurrency

  advanced-features:
    name: Advanced Product Feature Verification Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maet_test
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U postgres -d maet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      BUN_TEST: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maet_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # test:unit, test:integration and test:concurrency already run in their
      # own jobs; this job runs the remaining database-backed suites once.
      - name: Run Advanced Feature Tests & Verification
        run: bun run test:advanced

  e2e:
    name: End-to-End Critical Flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Type Check E2E Suite
        run: bunx tsc -p tests/e2e/tsconfig.json --noEmit

      # Builds the production bundle against a fake API origin and serves it; every
      # backend request is answered by tests/e2e/support/mock-api.ts.
      - name: Run E2E Suite
        run: bun run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    needs: [validate, paper-trading-integration, paper-trading-concurrency, advanced-features]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Frontend Bundle
        run: bun run build

  build-backend:
    name: Backend Server Build
    runs-on: ubuntu-latest
    needs: [validate, paper-trading-integration, paper-trading-concurrency, advanced-features]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Backend Server
        run: bun run --cwd server build
