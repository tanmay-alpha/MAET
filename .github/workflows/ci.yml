name: CI Validation Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      BUN_TEST: "1"
      ENABLE_MARKET_SIMULATOR: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Type Check
        run: bun run typecheck

      - name: Run Unit Test Suite
        run: bun run test:unit

  paper-trading-integration:
    name: Paper Trading Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maet_test
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U postgres -d maet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      BUN_TEST: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maet_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Integration Test Suite
        run: bun run test:integration

  paper-trading-concurrency:
    name: Paper Trading Concurrency Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maet_test
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U postgres -d maet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      BUN_TEST: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maet_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Concurrency Test Suite
        run: bun run test:concurrency

  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    needs: [validate, paper-trading-integration, paper-trading-concurrency]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Frontend Bundle
        run: bun run build

  build-backend:
    name: Backend Server Build
    runs-on: ubuntu-latest
    needs: [validate, paper-trading-integration, paper-trading-concurrency]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Backend Server
        run: bun run --cwd server build
